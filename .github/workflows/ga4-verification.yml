name: Read-only GA4 production verification
on:
  push:
    branches: [ops/ga4-verify-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read production HTML and public JS bundles
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            ga_check_dir=$(mktemp -d)
            trap 'rm -rf "$ga_check_dir"' EXIT
            ga_status=$(curl --fail --silent --show-error --max-time 30 https://cvbuilder.appshub.app/ -o "$ga_check_dir/home.html" -w '%{http_code}')
            echo "Homepage HTTP $ga_status"
            test "$ga_status" = 200
            echo 'Requested HTML gtag/measurement-ID grep:'
            grep -ioE 'gtag|googletagmanager|G-JDPCBTQLXD' "$ga_check_dir/home.html" || true
            echo 'Requested HTML environment-name grep:'
            grep -io 'NEXT_PUBLIC_GA_MEASUREMENT_ID' "$ga_check_dir/home.html" || true
            echo 'Homepage title:'
            sed 's/></>\n</g' "$ga_check_dir/home.html" | grep '<title>'
            grep -oE 'src="[^"]+\.js[^"]*"' "$ga_check_dir/home.html" | sed 's/^src="//;s/"$//' | sort -u > "$ga_check_dir/scripts"
            ga_found=0
            while IFS= read -r ga_path; do
              case "$ga_path" in /_next/static/*)
                curl --fail --silent --show-error --max-time 30 "https://cvbuilder.appshub.app$ga_path" -o "$ga_check_dir/chunk.js"
                if grep -Fq 'G-JDPCBTQLXD' "$ga_check_dir/chunk.js"; then
                  echo "Measurement ID exact match: PASS ($ga_path)"
                  ga_found=1
                  if grep -Fq 'googletagmanager.com/gtag/js?id=' "$ga_check_dir/chunk.js"; then echo 'GA4 loader in deployed JavaScript: PASS'; fi
                fi
              esac
            done < "$ga_check_dir/scripts"
            test "$ga_found" = 1

# Verify again after the GA4 regional gate deployment.
