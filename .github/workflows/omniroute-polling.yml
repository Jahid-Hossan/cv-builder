name: Build isolated OmniRoute polling patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/omniroute-polling.yml
      - scripts/patch-omniroute-polling.mjs
      - scripts/omniroute-visible-polling.mjs
      - scripts/omniroute-polling.test.mjs
permissions:
  contents: read
concurrency:
  group: omniroute-polling-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Test visibility, backoff, and cleanup
        run: node --test scripts/omniroute-polling.test.mjs
      - name: Build pinned image on isolated GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          task_original='diegosouzapw/omniroute@sha256:085c57adf499a8aaa9f35ccde95c0df9c11bd9ecd18d6c9edbf3b68b8079ba9d'
          task_image="omniroute:polling-${GITHUB_SHA:0:8}"
          df -h /
          free -m
          docker pull "$task_original"
          trap 'docker stop polling-build >/dev/null 2>&1 || true' EXIT
          docker run -d --name polling-build --cpus=3 --memory=14g --pids-limit=1024 --entrypoint sleep "$task_original" infinity
          docker cp scripts/patch-omniroute-polling.mjs polling-build:/tmp/patch-omniroute-polling.mjs
          docker cp scripts/omniroute-visible-polling.mjs polling-build:/tmp/omniroute-visible-polling.mjs
          docker exec polling-build node /tmp/patch-omniroute-polling.mjs /app
          docker exec polling-build sh -lc 'cp -a /app/node_modules /tmp/omniroute-runtime-modules && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps && npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund --legacy-peer-deps && node -e "const fs=require(\"fs\");fs.cpSync(\"/tmp/omniroute-runtime-modules\",\"/app/node_modules\",{recursive:true,force:false,errorOnExist:false,filter:(s,d)=>!fs.existsSync(d)||fs.lstatSync(d).isDirectory()});const a=require(\"/tmp/omniroute-runtime-modules/next/package.json\").version,b=require(\"/app/node_modules/next/package.json\").version;if(a!==b)throw Error(\"Next version changed\");console.log(\"Preserved Next version:\",b)"'
          docker exec -e NEXT_TELEMETRY_DISABLED=1 -e NODE_OPTIONS=--max-old-space-size=6144 -e CIRCLE_NODE_TOTAL=2 -e OMNIROUTE_USE_TURBOPACK=0 polling-build npm run build
          docker exec polling-build sh -lc 'test -f /app/.build/next/standalone/server.js && rm -rf /app/node_modules && cp -a /app/.build/next/standalone/. /app/ && rm -rf /tmp/omniroute-runtime-modules /app/.build/next/cache'
          docker commit --change 'ENTRYPOINT ["/app/check-permissions.sh"]' --change 'CMD ["node","dev/run-standalone.mjs"]' polling-build "$task_image"
          docker save "$task_image" | gzip -1 > omniroute-polling-image.tar.gz
      - name: Transfer built image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: omniroute-polling-image.tar.gz
          target: docker/omniroute-polling
          command_timeout: 20m
      - name: Load image without replacing live service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -eu
            task_sha='${{ github.sha }}'
            task_root="$HOME/docker/omniroute-polling"
            chmod 700 "$task_root"
            task_short=$(printf '%s' "$task_sha" | cut -c1-8)
            task_image="omniroute:polling-$task_short"
            docker image inspect "$(docker inspect omniroute --format '{{.Image}}')" --format '{{json .RepoDigests}}' | grep -F 'sha256:085c57adf499a8aaa9f35ccde95c0df9c11bd9ecd18d6c9edbf3b68b8079ba9d'
            gzip -dc "$task_root/omniroute-polling-image.tar.gz" | docker load
            docker image inspect "$task_image" --format 'Loaded image {{.Id}}'
            docker inspect omniroute > "$task_root/original-container.json"
            chmod 600 "$task_root/original-container.json"
            docker inspect omniroute --format '{{.Image}}' > "$task_root/original-image.txt"
            printf '%s\n' "$task_image" > "$task_root/patched-image.txt"
            printf '%s\n' "$task_sha" > "$task_root/patch-commit.txt"
            rm "$task_root/omniroute-polling-image.tar.gz"
            echo 'Built image loaded; live OmniRoute has not yet been replaced.'
