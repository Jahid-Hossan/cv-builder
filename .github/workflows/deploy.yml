name: Deploy CV Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ZONE_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID in repository Actions secrets."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID must be the 32-character zone ID for appshub.app."
            exit 1
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd ~/docker/cv-builder

            git fetch origin
            git reset --hard origin/main

            export NEXT_PUBLIC_CONTACT_EMAIL=contact@cvbuilder.appshub.app
            export NEXT_PUBLIC_ADSENSE_CLIENT_ID=ca-pub-4472223260681931
            docker build \
              --build-arg NEXT_PUBLIC_CONTACT_EMAIL="$NEXT_PUBLIC_CONTACT_EMAIL" \
              --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="$NEXT_PUBLIC_ADSENSE_CLIENT_ID" \
              -t cv-builder:latest .

            docker stop cv-builder || true
            docker rm cv-builder || true

            docker run -d \
              --name cv-builder \
              --restart unless-stopped \
              --network proxy \
              -e NEXT_PUBLIC_CONTACT_EMAIL="$NEXT_PUBLIC_CONTACT_EMAIL" \
              cv-builder:latest

            docker image prune -f

            docker ps --filter name=cv-builder

            # Confirm the replacement container serves HTML before purging the CDN.
            for attempt in 1 2 3 4 5; do
              if docker exec cv-builder wget -q -O /dev/null http://127.0.0.1:3000/; then break; fi
              sleep 2
            done
            docker exec cv-builder wget -q -O /dev/null http://127.0.0.1:3000/

      - name: Purge Cloudflare cache
        if: success()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          # Purge only the public CV Builder host; preserve personal-app caches.
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"hosts":["cvbuilder.appshub.app"]}' \
            --output "$response"
          jq '{success, errors, messages}' "$response"
          jq -e '.success == true' "$response" > /dev/null
          echo 'Cloudflare confirmed cache purge success.'

      - name: Verify production after purge
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            seo_html=$(mktemp)
            missing_html=$(mktemp)
            trap 'rm -f "$seo_html" "$missing_html"' EXIT
            echo 'CV Builder cache status immediately after purge:'
            curl --silent --show-error --max-time 30 -I https://cvbuilder.appshub.app/ | grep -iE '^HTTP/|^cf-cache-status:|^age:' || true
            echo 'Omni cache status (observational; DYNAMIC is valid for an API app):'
            curl --silent --show-error --max-time 30 -I https://omni.appshub.app/ | grep -iE '^HTTP/|^cf-cache-status:|^age:' || true
            # Normal public URLs, without cache-busting query parameters.
            for attempt in 1 2 3 4 5; do
              home_status=$(curl --silent --show-error --max-time 30 -o "$seo_html" -w '%{http_code}' https://cvbuilder.appshub.app/)
              missing_status=$(curl --silent --show-error --max-time 30 -o "$missing_html" -w '%{http_code}' https://cvbuilder.appshub.app/nonexistent)
              if [ "$home_status" = 200 ] && [ "$missing_status" = 404 ] &&
                grep -Fq '<meta property="og:site_name" content="Resume Builder by Appshub"/>' "$seo_html" &&
                grep -Fq '<p>This address does not match a page on Resume Builder.</p>' "$missing_html"; then break; fi
              sleep 3
            done
            echo "Homepage HTTP $home_status"
            echo "Nonexistent route HTTP $missing_status"
            test "$home_status" = 200
            test "$missing_status" = 404
            sed 's/></>\n</g' "$seo_html" | grep -Fx '<meta property="og:site_name" content="Resume Builder by Appshub"/>'
            sed 's/></>\n</g' "$missing_html" | grep -Fx '<p>This address does not match a page on Resume Builder.</p>'
            sed 's/></>\n</g' "$seo_html" | grep -Fx '<title>Free Resume Builder | Create a Professional CV Online</title>'
            sed 's/></>\n</g' "$seo_html" | grep -Fx '<meta name="description" content="Build a professional resume or CV in your browser. 15 free templates, live preview, custom fonts, and instant PDF download. No sign-up required."/>'
            sed 's/></>\n</g' "$seo_html" | grep -Fx '<link rel="canonical" href="https://cvbuilder.appshub.app"/>'
            echo 'Homepage HTML bytes:'
            wc -c < "$seo_html"
            echo 'Google Fonts/gstatic HTML matches (expected empty):'
            if grep -iE 'fonts.googleapis|fonts.gstatic|gstatic' "$seo_html"; then
              echo 'Unexpected external font reference in homepage HTML'
              exit 1
            fi
            echo 'Production ads.txt:'
            curl --fail --silent --show-error --max-time 30 https://cvbuilder.appshub.app/ads.txt
