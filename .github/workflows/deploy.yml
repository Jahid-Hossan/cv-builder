name: Deploy CV Builder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd ~/docker/cv-builder

            git fetch origin
            git reset --hard origin/main

            export NEXT_PUBLIC_CONTACT_EMAIL=contact@cvbuilder.appshub.app
            export NEXT_PUBLIC_ADSENSE_CLIENT_ID=ca-pub-4472223260681931
            docker build \
              --build-arg NEXT_PUBLIC_CONTACT_EMAIL="$NEXT_PUBLIC_CONTACT_EMAIL" \
              --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="$NEXT_PUBLIC_ADSENSE_CLIENT_ID" \
              -t cv-builder:latest .

            docker stop cv-builder || true
            docker rm cv-builder || true

            docker run -d \
              --name cv-builder \
              --restart unless-stopped \
              --network proxy \
              -e NEXT_PUBLIC_CONTACT_EMAIL="$NEXT_PUBLIC_CONTACT_EMAIL" \
              cv-builder:latest

            docker image prune -f

            docker ps --filter name=cv-builder

            # Read-only production verification; consent-gated scripts are absent before consent.
            echo 'Production ads.txt:'
            curl --silent --show-error --max-time 30 https://cvbuilder.appshub.app/ads.txt
            echo 'Production homepage AdSense tags:'
            curl --silent --show-error --max-time 30 https://cvbuilder.appshub.app/ | sed 's/></>\n</g' | grep -i 'adsbygoogle\|google-adsense' || true

            # Verify the deployed SEO metadata through the public production URL.
            seo_html=$(mktemp)
            trap 'rm -f "$seo_html"' EXIT
            curl --fail --silent --show-error --retry 3 --max-time 30 https://cvbuilder.appshub.app/ | sed 's/></>\n</g' > "$seo_html"
            echo 'Production homepage SEO:'
            grep -Fx '<title>Free Resume Builder | Create a Professional CV Online</title>' "$seo_html"
            grep -Fx '<meta name="description" content="Build a professional resume or CV in your browser. 15 free templates, live preview, custom fonts, and instant PDF download. No sign-up required."/>' "$seo_html"
            grep -Fx '<link rel="canonical" href="https://cvbuilder.appshub.app"/>' "$seo_html"
            grep -i 'resume builder' "$seo_html" | grep -v 'self.__next_f' | head -c 6000
            echo 'Production og:site_name:'
            grep -Fx '<meta property="og:site_name" content="Resume Builder by Appshub"/>' "$seo_html"
            echo 'Production nonexistent route:'
            missing_html=$(mktemp)
            trap 'rm -f "$seo_html" "$missing_html"' EXIT
            missing_status=$(curl --silent --show-error --max-time 30 -o "$missing_html" -w '%{http_code}' https://cvbuilder.appshub.app/nonexistent)
            echo "HTTP $missing_status"
            test "$missing_status" = 404
            sed 's/></>\n</g' "$missing_html" | grep -Fx '<p>This address does not match a page on Resume Builder.</p>'
