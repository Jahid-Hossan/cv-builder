name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect failed isolated build and live health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            echo 'Original image immutable digest:'
            docker image inspect "$(docker inspect omniroute --format '{{.Image}}')" --format '{{json .RepoDigests}}'
            echo 'Kernel OOM evidence for failed build (only memory-kill messages):'
            sudo -n journalctl -k --since '2026-10-05 18:27:00 UTC' --until '2026-10-05 18:36:00 UTC' --no-pager | grep -Ei 'oom-kill|out of memory|killed process' | tail -20 || true
            echo 'Container state and current resources:'
            docker inspect omniroute omniroute-polling-build-bc084e0d --format '{{.Name}} Status={{.State.Status}} OOM={{.State.OOMKilled}} Exit={{.State.ExitCode}}'
            docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} RAM={{.MemUsage}}' cv-builder omniroute
            free -m
            curl -sS -o /dev/null -w 'Omni HTTP %{http_code}\n' --max-time 20 https://omni.appshub.app/
            curl -sS -o /dev/null -w 'CV HTTP %{http_code}\n' --max-time 20 https://cvbuilder.appshub.app/
