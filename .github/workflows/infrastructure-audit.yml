name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect polling sources without changing services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo 'OmniRoute deployment identity (no env values):'
            docker inspect omniroute --format '{{json .Config.Image}} {{json .Config.WorkingDir}} {{json .Config.User}}'
            docker inspect omniroute --format '{{json (index .Config.Labels "com.docker.compose.project.working_dir")}} {{json (index .Config.Labels "com.docker.compose.project.config_files")}} {{json (index .Config.Labels "org.opencontainers.image.source")}}'
            docker inspect omniroute --format '{{range .Mounts}}{{println .Type .Source .Destination}}{{end}}'
            docker exec omniroute node -e '
             const fs=require("fs");
             const files=[
             "/app/src/shared/components/ProviderTestSlideOver.tsx",
             "/app/src/shared/components/MaintenanceBanner.tsx",
             "/app/src/app/(dashboard)/dashboard/HomePageClient.tsx",
             "/app/src/shared/components/RequestLoggerV2.tsx"
             ];
             for(const f of files){const lines=fs.readFileSync(f,"utf8").split("\n");const selected=new Set();
             for(let i=0;i<lines.length;i++){if(/setInterval|setTimeout|refreshInterval|refetchInterval|provider-metrics|usage\/call-logs|checkHealth|visibilitychange/.test(lines[i])){for(let j=Math.max(0,i-8);j<=Math.min(lines.length-1,i+16);j++)selected.add(j)}}
             console.log("FILE "+f);for(const i of [...selected].sort((a,b)=>a-b))console.log((i+1)+": "+lines[i]);
             }
             for(const f of ["/app/package.json","/app/Dockerfile","/app/docker-entrypoint.sh"]){try{let s=fs.readFileSync(f,"utf8");if(f.endsWith("package.json")){let p=JSON.parse(s);console.log(JSON.stringify({file:f,name:p.name,version:p.version,scripts:p.scripts}))}else console.log("FILE "+f+"\n"+s.slice(0,16000))}catch{console.log("MISSING "+f)}}
            '
            echo 'Host OmniRoute project locations (filenames only):'
            find /home /opt -maxdepth 5 -type f \( -name Dockerfile -o -name compose.yml -o -name docker-compose.yml \) 2>/dev/null | grep -i omni || true
            echo 'Host capacity:'
            df -h /
            free -m
            
