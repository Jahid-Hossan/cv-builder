name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect polling sources without changing services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo 'Runtime launch metadata (no secrets):'
            docker inspect omniroute --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}} {{json .Config.Healthcheck}}'
            docker exec omniroute node -e '
             const fs=require("fs");
             const selections=[
             ["/app/src/shared/components/RequestLoggerV2.tsx",[[1,120],[243,321],[701,755]]],
             ["/app/src/shared/components/MaintenanceBanner.tsx",[[1,85]]],
             ["/app/next.config.mjs",[[1,30]]]
             ];
             for(const [f,ranges] of selections){const lines=fs.readFileSync(f,"utf8").split("\n");console.log("FILE "+f);for(const [a,b] of ranges)for(let i=a-1;i<Math.min(lines.length,b);i++)console.log((i+1)+": "+lines[i]);}
             for(const p of ["/app/scripts/build/build-next-isolated.mjs","/app/.build/next/standalone/server.js","/app/server.js","/app/node_modules/next/package.json","/app/node_modules/typescript/package.json","/app/package-lock.json","/app/open-sse/package.json"]){console.log(JSON.stringify({path:p,exists:fs.existsSync(p)}))}
            '
            
