name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Restore existing OmniRoute and verify health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            echo 'Restore existing Redis and OmniRoute containers; preserve all configuration:'
            docker start omniroute-omniroute-redis-1 omniroute
            for task_attempt in $(seq 1 30); do
              if docker exec omniroute node -e 'fetch("http://127.0.0.1:20128/api/health/ping").then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))'; then break; fi
              sleep 2
            done
            docker exec omniroute node -e 'fetch("http://127.0.0.1:20128/api/health/ping").then(r=>{console.log("Local health HTTP",r.status);process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))'
            docker inspect omniroute --format 'Status={{.State.Status}} Running={{.State.Running}} OOM={{.State.OOMKilled}}'
            curl -sS -o /dev/null -w 'Omni HTTP %{http_code}\n' --max-time 20 https://omni.appshub.app/
            curl -sS -o /dev/null -w 'CV HTTP %{http_code}\n' --max-time 20 https://cvbuilder.appshub.app/
