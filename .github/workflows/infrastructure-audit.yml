name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose isolated candidate startup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            task_root="$HOME/docker/omniroute-polling"
            task_image=$(cat "$task_root/patched-image.txt")
            echo 'Non-secret original runtime settings:'
            node -e 'const x=require(process.argv[1])[0];for(const key of ["PORT","HOSTNAME","DATA_DIR","NODE_ENV","OMNIROUTE_MEMORY_MB"]){const v=x.Config.Env.find(e=>e.startsWith(key+"="));console.log(v||key+"=(not set)");}' "$task_root/original-container.json"
            task_debug=omniroute-polling-debug
            trap 'docker rm -f "$task_debug" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "$task_debug" --memory=2g --cpus=0.5 "$task_image"
            sleep 12
            docker inspect "$task_debug" --format 'Status={{.State.Status}} OOM={{.State.OOMKilled}} Exit={{.State.ExitCode}}'
            echo 'Sanitized startup log from empty-data candidate only:'
            docker logs --tail 100 "$task_debug" 2>&1 | grep -vEi 'token|secret|password|credential|api.key' || true
            echo 'Runtime native and SQLite availability:'
            for task_image in "$(cat "$task_root/original-image.txt")" "$(cat "$task_root/patched-image.txt")"; do
              echo "$task_image"
              docker run --rm --memory=512m --cpus=0.5 --entrypoint node "$task_image" -e '
              const fs=require("fs");console.log("node:sqlite exports",Object.keys(require("node:sqlite")));try{console.log("better-sqlite3",require.resolve("better-sqlite3"));}catch{console.log("better-sqlite3 absent");}
              function walk(p){if(!fs.existsSync(p))return;for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=p+"/"+e.name;if(e.isDirectory()&&f!=="/app/data"&&!f.includes("/cache"))walk(f);else if(e.isFile()&&e.name.endsWith(".node"))console.log(f);}}
              walk("/app");'
            done
