name: Read-only VPS polling audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/infrastructure-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect polling sources without changing services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            echo 'Read-only resource snapshot during bounded retry:'
            date -u
            free -m
            echo 'Current service and isolated build resource snapshot:'
            docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} RAM={{.MemUsage}}' cv-builder omniroute omniroute-polling-build-bc084e0d
            echo 'Isolated build process names and runtime:'
            docker top omniroute-polling-build-bc084e0d -eo pid,etime,comm
            echo 'Patched component syntax diagnostics:'
            docker exec omniroute-polling-build-bc084e0d node -e '
            const ts=require("typescript"),fs=require("fs");
            const files=["/app/src/shared/components/ProviderTestSlideOver.tsx","/app/src/shared/components/MaintenanceBanner.tsx","/app/src/shared/components/RequestLoggerV2.tsx","/app/src/app/(dashboard)/dashboard/HomePageClient.tsx"];
            for(const f of files){const result=ts.transpileModule(fs.readFileSync(f,"utf8"),{fileName:f,compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true});console.log(JSON.stringify({file:f,syntaxErrors:(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error).length}));}
            '
            echo 'Host disk remaining:'
            df -h /
            
